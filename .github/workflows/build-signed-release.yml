name: Build signed Android release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease
      - name: Sign and verify existing release certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/release-signing.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          # Validate the JKS store password separately from the alias.
          if ! keytool -list -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Invalid JKS keystore password or unreadable keystore." >&2
            exit 1
          fi

          # Validate that the configured alias exists in this keystore.
          if ! keytool -list -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "Configured key alias was not found in the JKS keystore." >&2
            exit 1
          fi

          # A certificate request requires the private key, validating key password.
          if ! keytool -certreq -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" -file "$RUNNER_TEMP/signing-preflight.csr" >/dev/null 2>&1; then
            echo "Private-key password is invalid or the alias has no accessible private key." >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing-preflight.csr"
          echo "JKS password, alias, and private-key password checks passed."

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type JKS --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD --out "$RUNNER_TEMP/Overtime-1.6.0.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Overtime-1.6.0.apk" | tee "$RUNNER_TEMP/signature.txt"
          ACTUAL="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -n 1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ "${#EXPECTED}" -ne 64 ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Signing certificate mismatch. Refusing to publish this APK." >&2
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -c 4 "$RUNNER_TEMP/Overtime-1.6.0.apk"
          mkdir -p dist
          cp "$RUNNER_TEMP/Overtime-1.6.0.apk" dist/
          (cd dist && sha256sum Overtime-1.6.0.apk > SHA256SUMS)
      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: OvertimeStats-1.5.0-signed-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
