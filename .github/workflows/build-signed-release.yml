name: Build signed Android release candidate

on:
  push:
    branches: [main]
    paths-ignore:
      - 'latest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease
      - name: Sign and verify existing release certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/release-signing.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          # Validate the JKS store password separately from the alias.
          if ! keytool -list -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Invalid JKS keystore password or unreadable keystore." >&2
            exit 1
          fi

          # Validate that the configured alias exists in this keystore.
          if ! keytool -list -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "Configured key alias was not found in the JKS keystore." >&2
            exit 1
          fi

          # A certificate request requires the private key, validating key password.
          if ! keytool -certreq -keystore "$KEYSTORE" -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" -file "$RUNNER_TEMP/signing-preflight.csr" >/dev/null 2>&1; then
            echo "Private-key password is invalid or the alias has no accessible private key." >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing-preflight.csr"
          echo "JKS password, alias, and private-key password checks passed."

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type JKS --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD --out "$RUNNER_TEMP/Overtime-1.7.2.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Overtime-1.7.2.apk" | tee "$RUNNER_TEMP/signature.txt"
          ACTUAL="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -n 1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ "${#EXPECTED}" -ne 64 ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Signing certificate mismatch. Refusing to publish this APK." >&2
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -c 4 "$RUNNER_TEMP/Overtime-1.7.2.apk"
          mkdir -p dist
          cp "$RUNNER_TEMP/Overtime-1.7.2.apk" dist/
          (cd dist && sha256sum Overtime-1.7.2.apk > SHA256SUMS)
      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: OvertimeStats-1.7.2-signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.7.2 dist/Overtime-1.7.2.apk dist/SHA256SUMS \
            --title "加班统计 v1.7.2" \
            --notes-file <(cat <<'NOTES'
          ## 月度净补偿与剩余工作日修正
          - 净补偿工时允许为负数，按已确认加班减去请假扣减计算。
          - 还需加班按月度目标减净补偿工时计算，净补偿为负数时相应增加。
          - 剩余工作日独立按工作日历统计，不因请假扣减而减少。
          - 加班及补偿时长统一使用小时格式，例如0.5h、1.5h、8h；负数显示为-4h。
          ## 月度目标与请假补偿
          - 月度超额工时目标：当月工作日数 × 20% × 8小时。
          - 首页及统计页显示目标工时、已确认加班、请假扣减、净补偿工时、还需加班和剩余工作日。
          - 支持登记全天请假，按8小时扣减月度净补偿，后续有效加班逐步补回。
          - 缺卡、迟到及请假与打卡冲突纳入待核对统计。
          - 工作日09:00—09:30（含）按正常考勤处理，当天加班额外扣减30分钟；09:31起待确认。
          - 每日加班分别向下取整至半小时；休息日仍先扣除1小时。
          NOTES
          )
      - name: Update latest version metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.7.2/Overtime-1.7.2.apk"
          SHA256="$(sha256sum dist/Overtime-1.7.2.apk | awk '{print $1}')"
          cat > latest.json <<EOF
          {
            "versionCode": 14,
            "versionName": "1.7.2",
            "channel": "release",
            "apkUrl": "$APK_URL",
            "sha256": "$SHA256",
            "notes": "1.7.2：加班及补偿时长统一使用h小时格式，支持半小时精度及负数；区分扣假前累计加班与扣假后净补偿。"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest release metadata to 1.7.2"
          git push
